site_name: Foliqant
site_description: Typed model decisions and deterministic Python workflows
site_url: https://sebastianwessel.github.io/foliqant/
repo_url: https://github.com/sebastianwessel/foliqant
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  language: en
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
extra_css:
  - assets/stylesheets/theme.css
extra:
  generator: false
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Overview: index.md
  - Guide:
      - Getting started:
          - Install and run: getting-started/runtime.md
          - Build with Claude or Codex: skills/foliqant.md
          - Understand the runtime: concepts/runtime.md
      - Configure your application:
          - Configuration and folder layout: configuration/index.md
          - Define a workflow: configuration/workflows.md
          - Define sequential flows: configuration/flows.md
          - Pass data and write prompts: configuration/context.md
          - Configure models: configuration/models.md
          - Connect MCP servers: configuration/mcp.md
      - Step types:
          - Choose a step type: steps/index.md
          - Decisions and classification: steps/decision.md
          - Extraction and text: steps/llm.md
          - Python handlers: steps/handler.md
          - Direct MCP calls: steps/mcp.md
          - Bounded agent loops: steps/agent-loops.md
          - Callable flow collections: steps/flow-collection.md
  - Tutorials:
      - Learning path: tutorials/index.md
      - Decisions and control flow:
          - 1. Classify one request: tutorials/decision-basics.md
          - 2. Add structured extraction: tutorials/structured-extraction.md
          - 3. Route between flows: tutorials/multiflow-routing.md
      - Tools and composition:
          - 4. Call a read-only MCP tool: tutorials/read-only-mcp.md
          - 5. Let a model use a tool: tutorials/model-tool-loop.md
          - 6. Process several requests: tutorials/multi-request-processing.md
  - Evaluation:
      - Plan your evaluation: evaluation/index.md
      - Create ground truth: evaluation/ground-truth.md
      - Score different task types: evaluation/task-types.md
      - Run, replay, and compare: evaluation/running.md
      - Read reports and confusion matrices: evaluation/results.md
      - Unit test with local fakes: evaluation/unit-testing.md
  - Reference:
      - Inputs, results, and errors: reference/inputs-and-results.md
      - Decision criteria and policy: guides/decision-contracts.md
      - Deployment and CLI: reference/runtime-configuration.md
