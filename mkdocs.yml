site_name: Foliqant
site_description: Typed model decisions and deterministic Python workflows
site_url: https://sebastianwessel.github.io/foliqant/
repo_url: https://github.com/sebastianwessel/foliqant
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  language: en
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
extra_css:
  - assets/stylesheets/theme.css
extra_javascript:
  - assets/javascripts/experience.js
extra:
  generator: false
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Overview: index.md
  - Guide:
      - Getting started:
          - Install and run: getting-started/runtime.md
          - Build with Claude or Codex: skills/foliqant.md
          - Understand the runtime: concepts/runtime.md
      - Configure your application:
          - Configuration and folder layout: configuration/index.md
          - Define a workflow: configuration/workflows.md
          - Define sequential flows: configuration/flows.md
          - Decide with conditions: configuration/conditions.md
          - Retry a flow with repeat: configuration/repeat.md
          - Pass data and write prompts: configuration/context.md
      - Choose a capability:
          - Find the right capability: steps/index.md
          - Answer yes or no: steps/yes-no.md
          - Choose one category: steps/classification.md
          - Assign several labels: steps/labeling.md
          - Assess priority or severity: steps/ranking.md
          - Find distinct requests: steps/request-extraction.md
          - Understand evidence and review: steps/decision.md
          - Extract JSON data: steps/llm.md
          - Generate text: steps/text.md
          - Let a model use tools: steps/agent-loops.md
          - Call an MCP tool directly: steps/mcp.md
          - Run Python logic: steps/handler.md
          - Process a list of requests: steps/flow-collection.md
      - Connect and configure:
          - Set up model profiles: configuration/models.md
          - Choose an AI provider: configuration/providers.md
          - Connect MCP servers: configuration/mcp.md
          - Supply secrets and environment: configuration/environment.md
          - Bound time, cost, and concurrency: configuration/limits.md
      - Integrate and deploy:
          - Embed in Python: integration/index.md
          - Expose an HTTP endpoint: integration/http.md
          - Use the result: integration/results.md
          - Handle errors and review: integration/errors.md
          - Handle multiple requests: integration/multiple-requests.md
          - Deploy your application: integration/deployment.md
          - Observe your workflow: integration/observability.md
      - Look up details:
          - Input and result fields: reference/inputs-and-results.md
          - Decision criteria and policy: guides/decision-contracts.md
          - Settings and CLI: reference/runtime-configuration.md
  - Tutorials:
      - Build a support-email assistant: tutorials/index.md
      - Set up the project: tutorials/setup.md
      - Decisions and control flow:
          - 1. Classify one request: tutorials/decision-basics.md
          - 2. Add structured extraction: tutorials/structured-extraction.md
          - 3. Route between flows: tutorials/multiflow-routing.md
      - Tools and composition:
          - 4. Call a read-only MCP tool: tutorials/read-only-mcp.md
          - Retry a lookup: tutorials/retry-lookup.md
          - 5. Let a model use a tool: tutorials/model-tool-loop.md
          - 6. Process several requests: tutorials/multi-request-processing.md
      - Evaluate the assistant: tutorials/evaluate.md
      - Connect your application: tutorials/integrate.md
  - Evaluation:
      - Plan your evaluation: evaluation/index.md
      - Create ground truth: evaluation/ground-truth.md
      - Score different task types: evaluation/task-types.md
      - Run, replay, and compare: evaluation/running.md
      - Read reports and confusion matrices: evaluation/results.md
      - Unit test with local fakes: evaluation/unit-testing.md
