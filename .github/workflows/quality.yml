name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --project model --locked --group dev
      - run: uv run --project model --no-sync python -m pytest -c model/pyproject.toml model/tests -q
      - run: uv run --project model --no-sync mypy --config-file model/pyproject.toml model/src
      - run: uv run --project model --no-sync ruff format --check --config model/pyproject.toml model/src model/tests
      - run: uv run --project model --no-sync ruff check --config model/pyproject.toml model/src model/tests
      - run: uv run --project model --no-sync python scripts/generate_model_schemas.py --check model/schemas
      - run: uv run --project model --no-sync python scripts/check_docs.py
      - run: uv run --project model --no-sync python scripts/check_tracked_data.py --git git
      - run: git diff --check

  runtime:
    name: Runtime package quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      # Individual tests opt into offline mode where it is part of their
      # contract. Do not force it for the whole suite: the wheel smoke test
      # creates a fresh virtual environment and must resolve its published
      # runtime dependencies on an uncached runner.
      - run: uv run --no-sync python -m pytest tests -q
      - run: uv run --no-sync mypy src examples
      - run: uv run --no-sync ruff check src tests scripts examples
      - run: uv run --no-sync ruff format --check src tests scripts examples
      - run: uv run --no-sync python scripts/generate_schemas.py --check
      - run: git diff --check

  documentation:
    name: Documentation build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --only-group docs
      - run: uv run --no-sync mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    name: Publish documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, runtime, documentation]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
