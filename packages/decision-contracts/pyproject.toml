[project]
name = "foliqant-decisions"
version = "0.1.0"
description = "Shared native decision contracts for Foliqant"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.5"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foliqant_decisions"]
