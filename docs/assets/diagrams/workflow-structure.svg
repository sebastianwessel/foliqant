<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" role="img" aria-labelledby="title desc">
<title id="title">One workflow, sequential flows, focused steps</title><desc id="desc">A workflow defines input, routes and output. Each flow runs an ordered list of steps. Steps interpret text, call tools or execute Python. The workflow, not the model, selects the next flow.</desc>
