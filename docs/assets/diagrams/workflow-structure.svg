<g><rect x="32" y="174" width="208" height="78" rx="10" fill="#173e45" stroke="#59dfc7"/><rect x="32" y="191" width="3" height="44" rx="1" fill="#59dfc7"/><text x="46" y="205" fill="#edf4ff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Triage flow</text><text x="46" y="227" fill="#c4d5eb" font-family="Arial,sans-serif" font-size="10.5">Classify → select a route</text></g>
<g><rect x="260" y="174" width="208" height="78" rx="10" fill="#293052" stroke="#aea2ff"/><rect x="260" y="191" width="3" height="44" rx="1" fill="#aea2ff"/><text x="274" y="205" fill="#edf4ff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Billing flow</text><text x="274" y="227" fill="#c4d5eb" font-family="Arial,sans-serif" font-size="10.5">Extract → lookup → draft</text></g>
