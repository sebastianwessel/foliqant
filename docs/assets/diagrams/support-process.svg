<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" role="img" aria-labelledby="title desc">
<title id="title">Support email: interpretation inside an explicit process</title><desc id="desc">An email is classified by AI. Authored rules send clear requests to a read-only lookup and a draft; uncertain requests return for human review. The host decides what to do with either result.</desc>
