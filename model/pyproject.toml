[project]
name = "foliqant-model"
version = "0.1.0"
description = "Local model training and customization tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "foliqant",
  "pydantic==2.13.5", "PyYAML==6.0.3", "huggingface-hub==1.32.0",
  "safetensors==0.8.0", "scipy==1.18.1", "jsonschema==4.26.0", "gguf==0.19.0", "pyarrow==25.0.1",
]

[project.scripts]
foliqant-model = "foliqant_model.cli:main"

[project.optional-dependencies]
mlx = [
  "mlx-lm[train]==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers==5.17.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
validation = ["transformers==5.17.0", "torch==2.14.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "mypy==2.3.1", "ruff==0.16.8", "build==1.6.1", "types-PyYAML==6.0.12.20260906"]

[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foliqant_model"]

[tool.uv.sources]
foliqant = { path = ".." }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration'"
markers = ["integration: real model/backend lifecycle requiring explicitly supplied local artifacts"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["foliqant", "foliqant_model"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_lm.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
