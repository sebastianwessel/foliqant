decision_authority_version: 1
default_allowed_classes:
  - D0
  - D1
decisions:
  - decision_id: DEC-WORKFLOW-SERVICE
    class: D2
    authority: explicit project-owner instruction to keep the Python/PydanticAI
      service as a simple in-memory input-to-result pipeline, with persistence,
      queue workers, application authentication and packaged transports out of scope
    scope_refs: [CAP-SERVICE-CONTRACTS, CAP-SERVICE-COMPILER, CAP-SERVICE-RUNTIME,
      CAP-SERVICE-MCP, CAP-SERVICE-PRIVACY, CAP-SERVICE-DX]
    source_refs: [11-workflow-service.md]
    status: implementation mandate; no fabricated digest-bound human or production approval
  - decision_id: DEC-CATEGORY-CATALOG-AUTHORING
    class: D2
    authority: project owner requested detailed category descriptions and deterministic
      snake_case normalization of recoverable key formatting with collision checks
    scope_refs: [CAP-NATIVE-DATA, CAP-BUSINESS-DECISIONS]
    source_refs: [09-native-decision-data.md, 10-business-decisions-and-processes.md]
    status: additive authoring implementation; immutable V1 schemas and recipe identities preserved
  - decision_id: DEC-BUSINESS-PROCESS-CONCEPT
    class: D2
    authority: project owner accepted the proposal and requested specs, concept
      and dataset research; exact implementation contracts require later review
    scope_refs: [CAP-BUSINESS-DECISIONS, CAP-PROCESS-BRANCHING, CAP-DOMAIN-DATA]
    source_refs: [10-business-decisions-and-processes.md, research/business-process-datasets.md]
    status: direction accepted; target specification proposed; no implementation or formal readiness approval
  - decision_id: DEC-MODEL-LIFECYCLE
    class: D2
    authority: project-owner implementation mandate; architecture author proposes,
      independent reviewer validates
    scope_refs:
      - CAP-ENV
      - CAP-DATA
      - CAP-MODEL
      - CAP-TRAIN
      - CAP-EVAL
      - CAP-RISK
      - CAP-EXPORT
      - CAP-VERIFY
      - CAP-GUIDES
    source_refs:
      - 00-vision.md
      - 01-model-lifecycle.md
    status: proposed
  - decision_id: DEC-NATIVE-DECISION-DATA
    class: D2
    authority: project-owner implementation mandate; specification author records
      exact boundaries and independent readiness reviewer validates before
      implementation acceptance
    scope_refs:
      - CAP-NATIVE-DATA
    source_refs:
      - 09-native-decision-data.md
      - research/input-answerability-and-reliability.md
    status: pipeline implemented; bounded generated-data quality repair independently reviewed and accepted; no formal digest approval, full-recipe coverage, training readiness, model-quality or production qualification
