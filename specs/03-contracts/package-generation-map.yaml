# Internal in-memory dataclasses are not a second public JSON Schema contract.
# The small HTTP example maps the generated envelope and ExecutionResult shapes;
# it adds no accepted-job, persistence, lookup or transport schema.

# Evaluation suites/reports are typed Python dataclasses in
# src/foliqant/evaluation/contracts.py; report.to_dict() is the sole JSON mapping.
# No separate handwritten JSON schema is maintained. test_evaluation.py checks
# scoring, privacy and serialization against those types.
# tests/test_example_evaluations.py checks example pipeline and isolated-step suites,
# the HTTP boundary and a deliberately wrong golden expectation as a negative control.
