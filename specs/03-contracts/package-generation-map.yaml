# Internal in-memory dataclasses are not a second public JSON Schema contract.
# The small HTTP example maps the generated envelope and ExecutionResult shapes;
# it adds no accepted-job, persistence, lookup or transport schema.

# Evaluation reports are unversioned typed dataclasses; report.to_dict() owns
# their JSON mapping. Explicit dataset wire input has its own generated schema.
# Content revisions/fingerprints identify inputs and measurements, not formats.
