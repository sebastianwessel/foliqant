mappings:
- mapping_id: MAP-PACKAGE-RESOLVE-ENVIRONMENT
  from_shape: package.authored-deployment
  to_shape: package.resolved-deployment
  direction: command_to_domain
  allowed_differences:
  - resolve-only-explicitly-annotated-environment-fields
  - unescape-doubled-dollar-literals-once
  - retain-resolved-secrets-only-in-ephemeral-settings
  redaction_or_loss_policy: Authored references remain serializable; literal and
    resolved secret values are redacted from JSON exports. Workflow strings and
    business values remain literal. Missing required variables fail locally and
    resolved values never become references or enter configuration revisions.
  field_operations:
  - environment:copy-snapshot-with-explicit-values-over-config-local-dotenv
  - annotated-reference:resolve-full-variable-name-once
  - annotated-literal:unescape-doubled-dollar-once
  - resolved-copy:validate-endpoints-and-credentials-before-opening-clients
  - other-fields:copy-without-interpolation
  verification:
  - ../tests/test_environment.py
  - ../tests/test_bootstrap.py
  - ../tests/test_model_configuration.py
  - ../tests/test_mcp_configuration.py
  - ../tests/test_telemetry_runtime.py
- mapping_id: MAP-PACKAGE-EVALUATION
  from_shape: package.evaluation-suite
  to_shape: package.evaluation-report
  direction: command_to_boundary
  allowed_differences:
  - actual-measurements-and-check-outcomes
  - omit-business-content
  redaction_or_loss_policy: Reports retain safe identifiers, suite fingerprint, caller
    revisions, outcomes and measurements only; no expected, input, response or raw
    exception values.
  field_operations:
  - suite:hash-immutable-inputs-and-expectations
  - checks:count-every-authored-expectation
  - measurements:preserve-unavailable-as-null
  verification:
  - ../tests/test_evaluation.py
  - ../tests/test_step_execution.py
  - ../tests/test_example_evaluations.py
- mapping_id: MAP-PACKAGE-ACCEPT-ENVELOPE
  from_shape: package.envelope
  to_shape: package.accepted-envelope
  direction: boundary_to_domain
  allowed_differences:
  - derive_or_enrich_optional_identity_context
  - recursively_freeze_json
  redaction_or_loss_policy: No business fields are omitted or coerced; mismatched
    optional context rejects when an explicit caller identity differs.
  field_operations:
  - payload:copy:immutable_json
  - metadata:copy:immutable_json
  - metadata.tenant_id:derive_context_or_validate_and_enrich_from_explicit_identity
  - metadata.principal_id:derive_context_or_validate_and_enrich_from_explicit_identity
  verification:
  - ../tests/test_envelope.py
  - ../tests/test_decoding.py
- mapping_id: MAP-CATEGORY-OPTIONS
  from_shape: model.category-catalog
  to_shape: model.decision-input
  direction: custom
  allowed_differences:
  - category-key-format-normalized
  redaction_or_loss_policy: Normalize new category formatting with collision checks;
    preserve descriptions and reject unknown output keys. Never rewrite historical
    V1 artifacts.
  field_operations:
  - category-id:normalize-and-check-unique
  - description:preserve
  - categories:convert-to-existing-decision-options
  verification:
  - model/tests/test_category_catalog.py
- mapping_id: MAP-BUSINESS-TASK-PLAN
  from_shape: business.decision-observations
  to_shape: business.process-task-plan
  direction: boundary_to_persistence
  allowed_differences:
  - host-owned-action-identities
  - configured-task-definitions
  - rule-audit-reasons
  redaction_or_loss_policy: Proposed only; no generator or wire schema exists. Preserve
    every request obligation, evidence revision and exclusion/review reason. Model
    prose is never executable policy; future schema/generation map must be frozen
    before implementation.
  field_operations:
  - request-instances:validate-and-reconcile-to-host-identities
  - confirmed-requests:map-through-allowlisted-process-configuration
  - conditional-or-unresolved-requests:hold-until-policy-resolves
  - complete-child-set:persist-before-dispatch
  verification:
  - specs/10-business-decisions-and-processes.md#data-and-acceptance
- mapping_id: MAP-SCOPED-SOURCE-PROJECTION
  from_shape: model.curation-plan
  to_shape: model.source-projection-plan
  direction: custom
  allowed_differences:
  - explicitly-scoped-native-tasks-added
  - selection-and-exclusion-report-added
  redaction_or_loss_policy: Full source annotations remain unchanged in the source
    corpus. Intent-only and teacher-hard-decision derivatives declare their scope.
    Probability distributions and slot labels never enter native prompts. Table comparison
    targets are independent of original QA answers. Plans stay private outside Git.
  field_operations:
  - frozenFamilies:preserve
  - source-rights:conservative-union
  - source-snapshot-hashes:bind
  - selected-records:deterministic-projection
  verification:
  - model/tests/test_source_projections.py
  - model/tests/test_projection_preparation.py
  - model/tests/test_projection_extension.py
- mapping_id: MAP-AUXILIARY-NATIVE-PROJECTION
  from_shape: model.data-record
  to_shape: model.decision-input
  direction: domain_to_domain
  allowed_differences:
  - source-annotation-projected-to-compatible-native-question
  - unsupported-source-targets-excluded-and-counted
  - generated-numeric-confidence-discarded
  redaction_or_loss_policy: Raw auxiliary records remain in source-corpus. A native
    seed is emitted only for a supported task mapping; provenance, rights, family
    and split are preserved and every exclusion is counted. Its inherited label remains
    unreviewed and enters a training partition only after exact blind verification.
  field_operations:
  - source-messages:map-to-state-sources
  - source-label-space:map-to-caller-question-contract
  - compatible-discrete-answer:map-to-typed-answer
  - source-record-id:attach-original-source-record-tag
  - probability-confidence-fields:omit-from-native-target
  - unsupported-free-answer-or-alignment:exclude-with-reason
  verification:
  - model/tests/test_decision_seeds.py
  - model/tests/test_decision_generation.py
- mapping_id: MAP-NATIVE-DECISION-PUBLISH
  from_shape: model.decision-output
  to_shape: model.dataset-artifact
  direction: domain_to_persistence
  allowed_differences:
  - decision-input-and-output-serialized-as-canonical-chat-messages
  - accepted-rewrites-and-required-lineage-parents-added
  - accepted-projections-published-once-after-verification
  - unchecked-solver-prose-replaced-by-corrected-reference-content
  - coverage-report-persisted-outside-dataset-manifest
  redaction_or_loss_policy: Full native rows stay in private dataset files; CLI and
    coverage summaries expose counts and safe reasons, never state text or answers.
    Unattempted and quarantined train parents remain diagnostic and are not published
    in native-decisions. No automatic path sets reviewed=true or creates numeric confidence
    targets.
  field_operations:
  - DecisionInput:serialize-to-user-message
  - DecisionOutput:serialize-to-final-assistant-message
  - held-out-seed:retain-unchanged-as-diagnostic
  - accepted-train-parent:attach-family-split-origin-and-rights
  - accepted-derivative:attach-generation-parent-lineage
  - corrected-reference-prose:remap-to-exact-rewritten-source-or-reject
  - coverage:aggregate-without-row-content
  verification:
  - model/tests/test_decision_contracts.py
  - model/tests/test_decision_runner.py
- mapping_id: MAP-DATASET-PREPARE
  from_shape: model.data-record
  to_shape: model.dataset-artifact
  direction: domain_to_persistence
  allowed_differences:
  - normalized-hashes-and-deterministic-split-metadata-added
  redaction_or_loss_policy: Chat-only files omit record metadata; full-record files
    retain validated records and leakage index hashes sensitive grouping text.
  field_operations:
  - messages:normalize-nfc-lf-for-hash
  - groupKeys:hash-in-leakage-index
  - record:assign-component-and-split
  - chats:write-canonical-id-sorted-fixed-path-jsonl
  - records:write-canonical-id-sorted-fixed-path-jsonl
  - canonical-emitted-files:hash-for-order-invariant-content-identity
  verification:
  - model/tests/test_data.py
- mapping_id: MAP-SOURCE-RIGHTS
  from_shape: model.dataset-config
  to_shape: model.dataset-artifact
  direction: command_to_domain
  allowed_differences:
  - local-source-path-omitted-from-durable-rights
  redaction_or_loss_policy: Original local source paths are not persisted in SourceRight.
  field_operations:
  - sources.path:omit
  - sources:project-to-sourceRights
  verification:
  - model/tests/test_contracts.py
- mapping_id: MAP-PARENT-SNAPSHOT
  from_shape: model.artifact-manifest
  to_shape: model.parent-snapshot
  direction: custom
  allowed_differences:
  - schema-version-omitted-only
  redaction_or_loss_policy: No lineage, inventory, rights, producer, details, or identity
    field is lost.
  field_operations:
  - schemaVersion:omit
  - parents:copy-recursively-with-bounds
  verification:
  - model/tests/test_artifacts.py
- mapping_id: MAP-TRAIN-WORKER
  from_shape: model.train-config
  to_shape: model.worker-request
  direction: command_to_domain
  allowed_differences:
  - camel-case-fields-renamed-to-pinned-backend-names
  - fixed-safe-backend-options-added
  - verified-private-paths-added
  redaction_or_loss_policy: Backend request adds only fixed options and verified paths;
    unknown user metadata is discarded.
  field_operations:
  - steps:rename:iters
  - gradientAccumulation:rename:grad_accumulation_steps
  - maxSequenceLength:rename:max_seq_length
  - promptMasking:set:true
  verification:
  - model/tests/test_training.py
- mapping_id: MAP-EVALUATION-WORKER
  from_shape: model.evaluation-config
  to_shape: model.worker-request
  direction: command_to_domain
  allowed_differences:
  - validators-and-timeout-remain-in-parent
  - validated-output-schema-copied-to-evaluation-artifact
  - fixed-zero-temperature-added
  - prompt-and-verified-paths-added
  redaction_or_loss_policy: The child receives only generation fields, prompt messages,
    and verified model paths.
  field_operations:
  - maxTokens:rename:maxTokens
  - seed:copy
  - temperature:set:0
  - outputSchema:validate-copy-and-hash-in-parent
  verification:
  - model/tests/test_backend.py
- mapping_id: MAP-WORKER-ADAPTER
  from_shape: model.worker-result
  to_shape: model.adapter-artifact
  direction: boundary_to_domain
  allowed_differences:
  - output-files-inspected-and-inventoried
  - private-worker-paths-removed
  - lineage-and-rights-added
  redaction_or_loss_policy: Private workspace paths are excluded from manifest details;
    referenced outputs are independently verified.
  field_operations:
  - train-result:validate-finite-metrics
  - output-paths:replace-with-file-inventory
  - backend-namespace:project-path-free-config
  verification:
  - model/tests/test_training.py
- mapping_id: MAP-ADAPTER-LEAKAGE
  from_shape: model.leakage-index
  to_shape: model.adapter-artifact
  direction: persistence_to_domain
  allowed_differences:
  - submitted-train-and-validation-plus-model-and-warm-start-exposure-union-retained
  redaction_or_loss_policy: Adapter leakage inventory conservatively contains every
    row submitted for train and validation plus model and warm-start ancestor exposure,
    and no plaintext grouping data.
  field_operations:
  - splits:filter:train-validation
  - entries:union-current-submission-model-and-warm-start-ancestor
  - ancestor-indexes:copy-exact-by-artifact-id
  - duplicate-record-id:require-identical-entry
  - entries:deduplicate-and-sort
  verification:
  - model/tests/test_lineage.py
- mapping_id: MAP-WORKER-PREDICTION
  from_shape: model.worker-result
  to_shape: model.prediction
  direction: boundary_to_domain
  allowed_differences:
  - reference-and-dataset-identifiers-added
  - parsed-json-and-validator-results-added
  redaction_or_loss_policy: Worker generation text and token metrics are preserved
    exactly; validation is deterministic in the parent.
  field_operations:
  - generated:copy
  - generatedTokens:copy
  - meanTokenLogprob:copy
  - finishReason:copy
  - generated:parse-json-or-null
  - configured-pointers:record-presence-separately-from-equality
  verification:
  - model/tests/test_evaluation.py
- mapping_id: MAP-WORKER-MODEL
  from_shape: model.worker-result
  to_shape: model.model-artifact
  direction: boundary_to_domain
  allowed_differences:
  - output-files-inspected-and-inventoried
  - lineage-precision-and-producer-metadata-added
  redaction_or_loss_policy: Private paths and child diagnostics are omitted; converted
    bytes and parsed metadata are preserved by hashes.
  field_operations:
  - outputPath:replace-with-file-inventory
  - parsed-metadata:copy
  - parent:add-verified-snapshot
  - leakage-index:copy-or-union-into-output-artifact
  - ancestor-indexes:retain-exact-by-artifact-id
  verification:
  - model/tests/test_transformations.py
- mapping_id: MAP-RUNTIME-SMOKE
  from_shape: model.model-artifact
  to_shape: model.runtime-smoke-report
  direction: custom
  allowed_differences:
  - independent-runtime-observation-added-outside-artifact
  - executable-command-and-result-identities-added
  redaction_or_loss_policy: Generated text remains in the private caller-chosen evidence
    file and is never added to the immutable artifact manifest.
  field_operations:
  - artifactId:copy-to-evidence-inputArtifactId
  - verified-export:run-fixed-bounded-local-generation
  - command-and-result:hash-canonical-json
  - report:hash-with-evidenceId-omitted
  verification:
  - scripts/verify_checkpoint_runtime.py
  - scripts/verify_gguf_runtime.py
- mapping_id: MAP-EVALUATION-REPORT
  from_shape: model.prediction
  to_shape: model.evaluation-artifact
  direction: domain_to_persistence
  allowed_differences:
  - predictions-stored-in-private-inventoried-jsonl
  - deterministic-aggregates-added
  redaction_or_loss_policy: Prediction text remains in the private JSONL and is never
    copied to CLI output or manifest aggregates.
  field_operations:
  - predictions:aggregate-count-rates
  - predictions:group-language-source-slices
  - representatives:record-deterministic-map
  verification:
  - model/tests/test_evaluation.py
- mapping_id: MAP-CALIBRATION-POLICY
  from_shape: model.evaluation-artifact
  to_shape: model.policy-artifact
  direction: domain_to_persistence
  allowed_differences:
  - only-component-representatives-used
  - fixed-threshold-or-abstain-all-produced
  redaction_or_loss_policy: Labels and prediction text are omitted; representative
    IDs/groups, counts, profile, dataset, and policy parameters are retained.
  field_operations:
  - predictions:filter-component-representatives
  - predictions:filter-risk-eligible
  - scores:select-threshold
  verification:
  - model/tests/test_risk.py
- mapping_id: MAP-AUDIT-RESULT
  from_shape: model.evaluation-artifact
  to_shape: model.audit-artifact
  direction: domain_to_persistence
  allowed_differences:
  - fixed-policy-applied-to-test-representatives
  - exact-binomial-summary-added
  redaction_or_loss_policy: Prediction text and labels are omitted; disjoint representative
    identities, counts, profile, policy and bound remain.
  field_operations:
  - predictions:filter-component-representatives
  - policy:apply-fixed-threshold
  - errors:compute-exact-binomial-upper-bound
  verification:
  - model/tests/test_risk.py
- mapping_id: MAP-ARTIFACT-CLI
  from_shape: model.artifact-manifest
  to_shape: model.cli-success
  direction: domain_to_boundary
  allowed_differences:
  - concise-command-specific-projection
  - content-and-recursive-lineage-omitted
  redaction_or_loss_policy: CLI output exposes IDs, counts, status and paths only;
    private content and rights references are never emitted.
  field_operations:
  - artifactId:copy
  - kind:copy
  - stage:copy
  - sourceRights:omit
  - parents:omit
  verification:
  - model/tests/test_cli.py
- mapping_id: MAP-WORKER-DOCTOR
  from_shape: model.worker-result
  to_shape: model.cli-success
  direction: custom
  allowed_differences:
  - request-identity-and-worker-envelope-omitted
  - parent-platform-and-disk-capabilities-added
  redaction_or_loss_policy: Import exceptions become a typed unavailable capability
    with a redacted reason; no child traceback or arbitrary JSON is exposed.
  field_operations:
  - mlxImportAvailable:rename:mlxAvailable
  - metalAvailable:rename:mlxDeviceAvailable
  - mlxVersion:project-to-components
  - mlxLmVersion:project-to-components
  verification:
  - model/tests/test_health_schemas.py
- mapping_id: MAP-FAILURE-RUN-STATE
  from_shape: model.cli-failure
  to_shape: model.run-state
  direction: boundary_to_persistence
  allowed_differences:
  - location-and-artifact-context-omitted-from-run-failure
  - lifecycle-timestamps-and-status-added
  redaction_or_loss_policy: Durable run failure retains only stable code and redacted
    message.
  field_operations:
  - error.code:copy-to-failure.code
  - error.message:copy-to-failure.message
  - error.location:omit
  - exitCode:map-to-terminal-status
  verification:
  - model/tests/test_execution.py
- mapping_id: MAP-SETUP-PREPARE
  from_shape: model.setup-profile
  to_shape: model.setup-receipt
  direction: custom
  allowed_differences:
  - verified-asset-identities-and-prepared-child-identities
  redaction_or_loss_policy: Source contents stay in the external workspace; receipt
    carries hashes and artifact identities.
  field_operations:
  - assets:verify-size-and-hash
  - profile:canonical-digest
  - prepared-artifacts:verify-identities
  verification:
  - model/tests/test_setup.py
  - plans/reviews/setup-execution.md
- mapping_id: MAP-SETUP-CLI
  from_shape: model.setup-receipt
  to_shape: model.cli-success
  direction: custom
  allowed_differences:
  - local-paths-and-reuse-counts-added
  redaction_or_loss_policy: CLI shows no dataset rows, weights or private agreements.
  field_operations:
  - profileSha256:copy
  - artifactIds:resolve-to-verified-local-paths
  verification:
  - model/tests/test_cli.py
  - plans/reviews/setup-execution.md
- mapping_id: MAP-CURATION-PUBLISH
  from_shape: model.curation-plan
  to_shape: model.dataset-artifact
  direction: custom
  allowed_differences:
  - accepted-derived-records-added-with-inherited-families
  - unsafe-candidates-quarantined
  redaction_or_loss_policy: Source records and generated text remain private local
    artifacts; CLI emits counts and artifact paths only. Automatic acceptance never
    adds human review.
  field_operations:
  - frozenFamilies:preserve
  - source-rights:conservative-union
  - generation:attach-observed-provenance
  verification:
  - model/tests/test_curation_runner.py
  - model/tests/test_frozen_families.py
