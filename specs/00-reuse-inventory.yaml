reuse_inventory_version: 1
discovery_revision: 7742096
assets:
  - asset_id: model.category-catalog
    kind: schema
    path: ../model/src/foliqant_model/curation/category_catalog.py
    public_export: CategoryCatalog, CategoryDefinition, normalize_category_key
    owner: native-decision-data
    stability: experimental
    consumers: [caller-question-authoring]
    extension_policy: Reuse DecisionOption; normalize new keys and check collisions;
      preserve V1 record readers and generation recipe identity.
  - asset_id: model.native-decision-contract
    kind: schema
    path: ../model/src/foliqant_model/curation/decision_contracts.py
    public_export: DecisionInput, DecisionOutput, Citation, RequestUnit, validate_decision_output
    owner: native-decision-data
    stability: versioned
    consumers: [curation, future-business-decisions]
    extension_policy: Preserve V1 and existing jobs; specify a new version before adding
      per-label evidence, trusted thread metadata or extract. Do not duplicate task enums.
  - asset_id: concept.workflow-service
    kind: research
    path: research/workflow-service-proposal.md
    public_export: none; proposed workflow core and adapter boundaries
    owner: workflow-proposal
    stability: experimental
    consumers: [future-process-branching]
    extension_policy: Extend one parent with bounded configured children; no model-generated
      graph or shared runtime dependency on Python training code.
  - asset_id: model.data-record-contract
    kind: schema
    path: ../model/src/foliqant_model/contracts/inputs.py
    public_export: DataRecord, FrozenFamilyAssignment, GenerationProvenance
    owner: model-contracts
    stability: versioned
    consumers:
      - data
      - curation
      - native-decision-data
    extension_policy: reuse unchanged as the published record/family/lineage boundary
  - asset_id: model.curation-source-acquisition
    kind: module
    path: ../model/src/foliqant_model/curation/sources.py
    public_export: acquire_source, source_catalog_digest
    owner: curation
    stability: versioned
    consumers:
      - curation-runner
      - native-decision-data
    extension_policy: project through explicit native mappings; retain raw auxiliary corpus and exclusion counts
  - asset_id: model.curation-endpoint
    kind: module
    path: ../model/src/foliqant_model/curation/endpoint.py
    public_export: discover_models, generate_json, EndpointModelIdentity
    owner: curation
    stability: versioned
    consumers:
      - curation-generation
      - native-decision-data
    extension_policy: reuse serial bounded validated JSON calls; no second provider client
  - asset_id: model.curation-storage
    kind: module
    path: ../model/src/foliqant_model/curation/storage.py
    public_export: immutable object cache and run lock functions
    owner: curation
    stability: internal
    consumers:
      - curation-runner
      - native-decision-data
    extension_policy: reuse immutable private cache, integrity checks and locking
  - asset_id: model.dataset-publication
    kind: module
    path: ../model/src/foliqant_model/data.py
    public_export: prepare_dataset
    owner: data
    stability: versioned
    consumers:
      - curation-runner
      - native-decision-data
    extension_policy: publish through existing frozen-family dataset artifact; no parallel dataset format
  - asset_id: research.model
    kind: research
    path: research/model-research.md
    public_export: none
    owner: model
    stability: research
    consumers:
      - model-author
    extension_policy: background only; requirements live in normative specs
  - asset_id: example.triage
    kind: schema
    path: ../contracts/triage-answer.schema.json
    public_export: illustrative financial-triage answer
    owner: workflow proposal
    stability: experimental
    consumers:
      - evaluation example
    extension_policy: do not make it the universal training record contract
