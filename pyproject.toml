[project]
name = "foliqant"
version = "0.1.0"
description = "Typed, deterministic in-memory workflows for financial decisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.5",
  "pydantic-ai-slim==2.46.0",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "python-dotenv==1.2.3",
]

[project.scripts]
foliqant = "foliqant.cli:main"

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]==2.46.0"]
anthropic = ["pydantic-ai-slim[anthropic]==2.46.0"]
azure = ["pydantic-ai-slim[openai]==2.46.0"]
mcp = ["mcp==2.2.0", "httpx2==2.13.0", "cryptography==50.0.1"]
telemetry = [
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[dependency-groups]
docs = ["mkdocs==1.6.1"]
http-example = ["starlette==1.6.0", "uvicorn==0.53.0", "httpx2==2.13.0"]
dev = [
  { include-group = "http-example" },
  "build==1.6.1",
  "hatchling==1.32.4",
  "pytest==9.1.1", "pytest-asyncio==1.4.0", "mypy==2.3.1", "ruff==0.16.8",
  "types-PyYAML==6.0.12.20260906",
  "types-jsonschema==4.26.0.20260518",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foliqant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra -m 'not live_model'"
markers = [
  "integration: real local protocol integration",
  "live_model: explicitly enabled model inference; never part of default tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["foliqant", "foliqant_model"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
