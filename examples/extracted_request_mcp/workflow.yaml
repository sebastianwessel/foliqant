version: 1
name: extracted_request_lookup
start: extract
defaults:
  model: local_qwen
input_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    message:
      type: string
      minLength: 1
    language:
      enum: [en, de]
    contact_email:
      type: string
      minLength: 1
  required: [message, language, contact_email]
  additionalProperties: false
output:
  pointer: /steps/lookup/result
  optional: true
  default:
    status: needs_review
steps:
  extract:
    type: llm
    input:
      message:
        pointer: /payload/message
      language:
        pointer: /payload/language
    instructions: >-
      Extract the public-request reference and preserve the supplied language.
      Write a short internal summary. Never infer or copy contact information.
    output:
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: object
        properties:
          reference:
            type: string
            pattern: ^FOI-[0-9]{4}-[0-9]{4}$
          language:
            enum: [en, de]
          internal_summary:
            type: string
            minLength: 1
        required: [reference, language, internal_summary]
        additionalProperties: false
    next: lookup
  lookup:
    type: mcp
    server: records_office
    tool: lookup_request
    arguments:
      reference:
        pointer: /steps/extract/result/reference
      language:
        pointer: /steps/extract/result/language
    next: done
  done:
    type: finish
    outcome: completed
