defaults:
  model: local_qwen
  on_unresolved:
    outcome: needs_review
start: classify
input_schema: input.schema.json
output:
  first_of:
    - pointer: /flows/billing/result
    - pointer: /flows/cancellation/result
  default:
    disposition: needs_review
flows:
  classify:
    input:
      message:
        pointer: /payload/message
    transition:
      binding:
        pointer: /flows/classify/result
      cases:
        billing:
          flow: billing
        cancellation:
          flow: cancellation
      default:
        outcome: needs_review
  billing:
    input:
      message:
        pointer: /payload/message
    transition:
      outcome: completed
  cancellation:
    input:
      message:
        pointer: /payload/message
    transition:
      outcome: completed
