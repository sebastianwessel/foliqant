models:
  local_qwen:
    provider: openai_compatible
    model: $MODEL_ID
    base_url: $MODEL_BASE_URL
    allow_insecure_http: true
    output_mode: native
    supports_tools: true
    concurrency: 1
    queue_limit: 0
    request_timeout: 300
    options:
      max_tokens: 2048
      temperature: 0.1
mcp:
  account_records:
    transport:
      type: stdio
      command: $FOLIQANT_EXAMPLE_PYTHON
      args:
        - -m
        - examples.support_email_tutorial.server
      cwd: $FOLIQANT_EXAMPLE_ROOT
      env:
        PYTHONUNBUFFERED: '1'
    catalog:
      tools:
        lookup_account:
          input_schema:
            type: object
            properties:
              account_reference:
                title: Account Reference
                type: string
            required:
              - account_reference
            title: lookup_accountArguments
          output_schema:
            type: object
            additionalProperties: false
            properties:
              account_reference:
                title: Account Reference
                type: string
              plan:
                title: Plan
                type: string
              renewal_date:
                title: Renewal Date
                type: string
            required:
              - account_reference
              - plan
              - renewal_date
            title: AccountRecord
          effect: read
    concurrency: 1
    queue_limit: 0
    request_timeout: 3
    output_limit_bytes: 4096
execution:
  concurrency: 1
  queue_limit: 0
  run_timeout: 620
  model_timeout: 300
  tool_timeout: 3
handlers:
  require_reference:
    input_schema: shared/handler_contracts/require_reference.input.json
    output_schema: shared/handler_contracts/require_reference.output.json
    effect: read
  plan_support_requests:
    input_schema: shared/handler_contracts/plan_support_requests.input.json
    output_schema: shared/handler_contracts/plan_support_requests.output.json
    effect: read
  prepare_support_task:
    input_schema: shared/handler_contracts/prepare_support_task.input.json
    output_schema: shared/handler_contracts/prepare_support_task.output.json
    effect: read
  decide_support_disposition:
    input_schema: shared/handler_contracts/decide_support_disposition.input.json
    output_schema: shared/handler_contracts/decide_support_disposition.output.json
    effect: read
