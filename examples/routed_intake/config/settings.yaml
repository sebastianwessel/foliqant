models:
  local:
    provider: openai_compatible
    model: $MODEL_ID
    base_url: $MODEL_BASE_URL
    allow_insecure_http: true
    output_mode: native
    supports_tools: false
    concurrency: 1
    queue_limit: 0
    request_timeout: 300
    options:
      max_tokens: 2048
      temperature: 0.1
execution:
  concurrency: 1
  queue_limit: 0
  model_timeout: 300
  run_timeout: 610
handlers:
  prepare_billing:
    input_schema: contracts/handoff.input.json
    output_schema: contracts/handoff.output.json
    effect: read
  prepare_cancellation:
    input_schema: contracts/handoff.input.json
    output_schema: contracts/handoff.output.json
    effect: read
