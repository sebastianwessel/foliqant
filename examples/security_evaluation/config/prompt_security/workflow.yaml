defaults:
  model: local_qwen
input_schema: security/input.schema.json
output:
  pointer: /flows/security/result
flows:
  security:
    input:
      original_message: {pointer: /payload/original_message}
      attachment: {pointer: /payload/attachment}
      prior_assessment: {pointer: /payload/prior_assessment}
    transition: {outcome: completed}
    on_unresolved: {outcome: needs_review}
