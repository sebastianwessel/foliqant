version: 1
workflows:
  decision_evidence: .
  decision_predicate: predicate
models:
  local_qwen:
    provider: openai_compatible
    model: $FOLIQANT_CURATION_MODEL
    base_url: $FOLIQANT_CURATION_ENDPOINT_URL
    allow_insecure_http: true
    output_mode: native
    supports_tools: false
    concurrency: 1
    queue_limit: 0
    request_timeout: 300
    options:
      max_tokens: 8192
      temperature: 0.1
      reasoning_effort: low
execution:
  concurrency: 1
  queue_limit: 0
  model_timeout: 300
  run_timeout: 610
evaluation:
  dataset: ../../.foliqant/evaluation/decision-evidence-r4.json
